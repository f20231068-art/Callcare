[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "carecall"
version = "0.1.0"
description = "Voice check-in agent for elderly parents: meals, medicines, reminders"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",  # Postgres driver
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "langgraph>=0.2",
  "langfuse>=3.0",
  "twilio>=9.0",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "python-multipart>=0.0.9",  # Twilio webhooks are form-encoded
  "websockets>=12.0",
  "tzdata>=2024.1",
  "pyngrok>=7.0",  # dev tunnel: gives the laptop a public https address for Twilio
  "audioop-lts>=0.2; python_version >= '3.13'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-timeout>=2.3"]

[project.scripts]
carecall = "carecall.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
carecall = ["evals/scenarios/*.yaml", "web/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout = 30
filterwarnings = ["ignore:.*audioop.*:DeprecationWarning"]
testpaths = ["tests"]
